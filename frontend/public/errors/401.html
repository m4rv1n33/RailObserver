<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>401 Unauthorized | RailObserver</title>
<style>
:root {
  --bg: #09090b;
  --fg: #f4f4f5;
  --muted: #a1a1aa;
  --faint: #71717a;
  --line: #27272a;
  --accent: #eb0000;
  --sans: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-align: center;
}
main { max-width: 36rem; }
.eyebrow {
  margin-bottom: 1.25rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow span { color: var(--accent); }
h1 {
  font-size: clamp(4.5rem, 20vw, 8rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.025em;
}
h2 {
  margin-top: 1rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
  font-size: clamp(1.875rem, 6vw, 2.25rem);
  font-weight: 700;
  letter-spacing: -0.025em;
}
p.message {
  margin-top: 1.5rem;
  font-size: 1.125rem;
  line-height: 1.625;
  color: var(--muted);
}
::selection { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
<p class="eyebrow"><span>401</span> / RailObserver</p>
<h1>401</h1>
<h2>Unauthorized</h2>
<p class="message">You need to log in to view this.</p>
</main>
</body>
</html>
