services:
  postgres:
    image: postgres:16-alpine
    container_name: railobserver-postgres
    environment:
      POSTGRES_DB: railobserver
      POSTGRES_USER: railobserver
      POSTGRES_PASSWORD: railobserver
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
