server:
  # Behind a reverse proxy the socket address is the proxy, so the real client
  # address has to come from X-Forwarded-For. Tomcat rewrites it only for
  # requests that arrived from one of the proxies below, which is the
  # Docker-internal range; a header sent by anything else is ignored. Without
  # that restriction the login lockout is keyed on a value the caller supplies
  # and throttles nobody.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 172\.1[6-9]\..*|172\.2[0-9]\..*|172\.3[01]\..*

spring:
  application:
    name: railobserver
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  http:
    # Applies to every RestClient built from the injected builder, which is
    # both transport providers. A hung upstream otherwise holds a Tomcat worker
    # until the connection dies on its own, and station autocomplete calls one
    # of them on nearly every keystroke.
    client:
      connect-timeout: 3s
      read-timeout: 8s

railobserver:
  auth:
    # Shared PIN or passphrase for the whole app. Empty means the API stays open,
    # which is fine locally; the prod profile refuses to start without it.
    pin: ${RAILOBSERVER_AUTH_PIN:}
    # Random value (32+ characters) signing the session cookie. Changing it logs
    # out every device.
    secret: ${RAILOBSERVER_AUTH_SECRET:}
    session-days: 365
    # Cookies marked secure are only sent over HTTPS; set false to test over http.
    cookie-secure: ${RAILOBSERVER_AUTH_COOKIE_SECURE:true}
    max-attempts: 5
    lockout-minutes: 15
  formation:
    # opentransportdata.swiss Train Formation API. Token comes from the
    # OTD_API_TOKEN environment variable or backend/.env (see .env.example);
    # the feature is disabled when unset.
    base-url: https://api.opentransportdata.swiss/formation/v1
    token: ${OTD_API_TOKEN:}
    default-evu: SBBP
