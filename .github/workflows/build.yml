# Builds both images and pushes them to GHCR. Runs on GitHub's runners, never a
# self-hosted one: this repository is public, and a self-hosted runner would let
# any pull request from any fork execute code on the home network.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two images are independent, so one failing should not cancel the
      # other and hide whether it would have built.
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/m4rv1n33/railobserver-backend
          - component: frontend
            image: ghcr.io/m4rv1n33/railobserver-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # The sha tag is what an environment is pinned to; latest is what the
          # server polls for. Both move on every push to main.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per component, otherwise the two jobs overwrite each other's
          # cache on every run and neither ever hits.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
